# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: build-and-test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    # Windows first: most consumers build there and the release is packed there. Linux catches what only shows on a
    # case-sensitive file system with '/' paths (agents, containers, Linux build agents).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    # The Windows run keeps the check name 'build-and-test' that branch protection may require.
    name: build-and-test${{ matrix.os != 'windows-latest' && format(' ({0})', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    # A full run takes about 5 minutes; a hung browser should not hold the runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TALXIS.TestKit.Bindings/driver/package-lock.json
      - name: Install driver dependencies
        run: npm ci
        working-directory: TALXIS.TestKit.Bindings/driver
      - name: Test driver
        run: npm run test:ci
        working-directory: TALXIS.TestKit.Bindings/driver
      - name: Build
        run: dotnet build TALXIS.TestKit.sln --configuration Release
      # The tests drive static pages in a headless Chrome.
      - name: Test
        run: dotnet test TALXIS.TestKit.sln --configuration Release --no-build
      # Pack as publish.yml does and build projects that use the packages: the .targets, the data file task and the
      # target framework check only take effect in a consumer's build (1.0.10 shipped a .targets without its task).
      - name: Pack
        run: |
          $v = '0.0.0-ci'
          $p = "-p:Version=$v", "-p:PackageVersion=$v", '-p:AssemblyVersion=0.0.0.0', '-p:FileVersion=0.0.0.0'
          dotnet build TALXIS.TestKit.sln --configuration Release @p
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $projects = @(
            'TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors.Api.Browser/TALXIS.TestKit.Selectors.Browser.csproj'
            'TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors.csproj'
            'TALXIS.TestKit.Bindings/bindings/src/TALXIS.TestKit.Bindings/TALXIS.TestKit.Bindings.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project --configuration Release --no-build @p --output "$env:RUNNER_TEMP/packages"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Check the packages
        run: ./.github/scripts/Test-Package.ps1 -Feed "$env:RUNNER_TEMP/packages" -Version 0.0.0-ci
