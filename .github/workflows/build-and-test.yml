# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: build-and-test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    runs-on: windows-latest
    # A full run takes about 5 minutes; a hung browser should not hold the runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TALXIS.TestKit.Bindings/driver/package-lock.json
      - name: Install driver dependencies
        run: npm ci
        working-directory: TALXIS.TestKit.Bindings/driver
      - name: Test driver
        run: npm run test:ci
        working-directory: TALXIS.TestKit.Bindings/driver
      - name: Build
        run: dotnet build TALXIS.TestKit.sln --configuration Release
      # The tests drive static pages in a headless Chrome.
      - name: Test
        run: dotnet test TALXIS.TestKit.sln --configuration Release --no-build
