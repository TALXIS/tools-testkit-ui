# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: nuget-package/

defaults:
  run:
    shell: pwsh

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      assembly-version: ${{ steps.version.outputs.assembly-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
            if ($tag -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9\.\-]+)?$') {
              Write-Error "Invalid tag format '${{ github.event.release.tag_name }}'. Expected vX.Y.Z or vX.Y.Z-prerelease."
              exit 1
            }

            "package-version=$tag" >> $env:GITHUB_OUTPUT
            $numeric = ($tag -replace '-.*', '') + ".0"
            "assembly-version=$numeric" >> $env:GITHUB_OUTPUT
          } else {
            [xml]$props = Get-Content "Directory.Build.props"
            $ver = $props.Project.PropertyGroup.Version
            "package-version=$ver" >> $env:GITHUB_OUTPUT
            "assembly-version=$($ver).0" >> $env:GITHUB_OUTPUT
          }
      - name: Print resolved version
        run: |
          Write-Host "Package version  = ${{ steps.version.outputs.package-version }}"
          Write-Host "Assembly version = ${{ steps.version.outputs.assembly-version }}"

  create_nuget:
    needs: [resolve-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TALXIS.TestKit.Bindings/driver/package-lock.json
      - name: Install driver dependencies
        run: npm ci
        working-directory: TALXIS.TestKit.Bindings/driver
      - name: Assemble cumulative release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --limit 100 --json tagName --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}'
          $changelog = ""
          foreach ($tag in ($releases -split "`n" | Where-Object { $_ -ne "" })) {
            $version = $tag -replace '^v', ''
            $body = gh release view $tag --json body --template '{{.body}}'
            $plain = $body `
              -replace '#{1,6}\s*', '' `
              -replace '\*{1,2}([^*]+)\*{1,2}', '$1' `
              -replace '`([^`]+)`', '$1' `
              -replace '\[([^\]]+)\]\([^\)]+\)', '$1' `
              -replace '```[\s\S]*?```', '' `
              -replace '\r\n', "`n" `
              -replace '\r', "`n"
            $indented = ($plain -split "`n" | ForEach-Object {
              if ($_.Trim() -ne "") { "  $_" } else { "" }
            }) -join "`n"
            $changelog += "${version}:`n${indented}`n`n"
          }
          Set-Content -Path "release-notes.txt" -Value $changelog -Encoding UTF8
      - name: Write release notes targets file
        if: github.event_name == 'release'
        run: |
          $notes = Get-Content "release-notes.txt" -Raw -Encoding UTF8
          $escaped = [System.Security.SecurityElement]::Escape($notes)
          $targetsContent = @"
          <Project>
            <PropertyGroup>
              <PackageReleaseNotes>$escaped</PackageReleaseNotes>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.targets" -Value $targetsContent -Encoding UTF8
      - name: Create NuGet packages
        run: |
          $pkgVer = "${{ needs.resolve-version.outputs.package-version }}"
          $asmVer = "${{ needs.resolve-version.outputs.assembly-version }}"
          dotnet build TALXIS.TestKit.sln --configuration Release -p:Version=$pkgVer -p:PackageVersion=$pkgVer -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
          dotnet pack TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors.Api.Browser/TALXIS.TestKit.Selectors.Browser.csproj --configuration Release --no-build -p:Version=$pkgVer -p:PackageVersion=$pkgVer -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
          dotnet pack TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors.csproj --configuration Release --no-build -p:Version=$pkgVer -p:PackageVersion=$pkgVer -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
          dotnet pack TALXIS.TestKit.Bindings/bindings/src/TALXIS.TestKit.Bindings/TALXIS.TestKit.Bindings.csproj --configuration Release --no-build -p:Version=$pkgVer -p:PackageVersion=$pkgVer -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            TALXIS.TestKit.Bindings/bindings/src/TALXIS.TestKit.Bindings/bin/Release/*.nupkg
            TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors/bin/Release/*.nupkg
            TALXIS.TestKit.Selectors/TALXIS.TestKit.Selectors.Api.Browser/bin/Release/*.nupkg

  deploy:
    needs: [create_nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Publish NuGet packages
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
